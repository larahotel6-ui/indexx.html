<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Board — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — visual tokens for the board
     ============================================================ */
  :root{
    --bg: #0a0c10;
    --case: #14171c;
    --case-edge: #24282f;
    --tile: #1b1e24;
    --tile-edge: #05060a;
    --amber: #ffb100;
    --text: #e8e6e0;
    --white: #ffffff;
    --muted: #6b7078;
    --green: #34d17c;
    --red: #ff5a4d;
    --orange: #ff8a1f;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #12151a 0%, var(--bg) 65%);
    color:var(--text);
    font-family:'Oswald', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }

  .board{
    width:100%;
    max-width:1400px;
    background:var(--case);
    border:1px solid var(--case-edge);
    border-radius:8px;
    box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
    overflow:hidden;
    position:relative;
  }

  .board-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 36px;
    border-bottom:2px solid var(--case-edge);
    background:linear-gradient(180deg,#181c22,#14171c);
  }

  .board-title{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .live-dot{
    width:11px; height:11px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.4; }
  }

  .board-title h1{
    font-size:26px;
    letter-spacing:.16em;
    font-weight:600;
    margin:0;
  }

  .clock{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color:var(--muted);
    letter-spacing:.05em;
  }

  .column-labels{
    display:flex;
    align-items:center;
    padding:14px 36px;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--muted);
    border-bottom:1px solid var(--case-edge);
  }
  .col-row{ width:90px; }
  .col-id{ flex:1; }
  .col-status{ width:170px; text-align:right; }

  .rows{
    max-height:70vh;
    overflow-y:auto;
    padding:10px 0;
    scroll-behavior:smooth;
  }

  .rows::-webkit-scrollbar{ width:0; }

  .order-row{
    display:flex;
    align-items:center;
    padding:20px 36px;
    border-bottom:1px solid rgba(255,255,255,.03);
    position:relative;
  }

  .row-number{
    width:90px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    font-size:20px;
  }

  .flap-id{
    flex:1;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  /* Order-ID digits: bright white, crisp, with a slight glow so they
     stay easy to read even on washed-out TV panels */
  .flap{
    position:relative;
    width:56px;
    height:78px;
    background:var(--tile);
    border:1px solid var(--tile-edge);
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:44px;
    font-weight:600;
    color:var(--white);
    text-shadow: 0 0 6px rgba(255,255,255,.35);
    overflow:hidden;
  }
  .flap::after{
    content:'';
    position:absolute;
    top:50%; left:0; right:0;
    height:2px;
    background:var(--tile-edge);
    transform:translateY(-1px);
  }
  .flap.space{ background:transparent; border-color:transparent; }

  @keyframes flapIn{
    0%{ transform:rotateX(90deg); opacity:0; }
    60%{ transform:rotateX(-8deg); opacity:1; }
    100%{ transform:rotateX(0deg); opacity:1; }
  }
  .flap.animate{
    animation: flapIn .45s ease both;
    transform-origin:50% 0%;
  }

  .status-pill{
    width:170px;
    text-align:right;
  }
  .status-pill span{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    letter-spacing:.1em;
    color:var(--green);
    border:1px solid rgba(52,209,124,.3);
    background:rgba(52,209,124,.08);
    padding:7px 13px;
    border-radius:4px;
  }

  .order-row.leaving{
    animation: fadeOut .35s ease forwards;
  }
  @keyframes fadeOut{
    to{ opacity:0; transform:translateX(12px); }
  }

  .empty-state{
    padding:80px 36px;
    text-align:center;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    letter-spacing:.05em;
  }

  .conn-banner{
    display:none;
    background:rgba(255,90,77,.1);
    color:var(--red);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    text-align:center;
    padding:12px;
    border-bottom:1px solid var(--red);
  }

  /* Full-width marker line for the newest order — stretches edge to
     edge of the screen, not just the card, so it reads as "latest". */
  .latest-line{
    position:fixed;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg, rgba(255,138,31,0), var(--orange) 15%, var(--orange) 85%, rgba(255,138,31,0));
    box-shadow:0 0 14px 2px rgba(255,138,31,.65);
    pointer-events:none;
    z-index:50;
    transition: top .35s ease, opacity .35s ease;
    opacity:0;
  }
  .latest-line.visible{ opacity:1; }

  /* Large TV / display screens: scale everything up further */
  @media (min-width:1600px){
    .board{ max-width:1800px; }
    .board-title h1{ font-size:34px; }
    .clock{ font-size:26px; }
    .flap{ width:74px; height:104px; font-size:58px; }
    .row-number{ width:110px; font-size:26px; }
    .status-pill{ width:200px; }
    .status-pill span{ font-size:17px; padding:9px 16px; }
  }

  /* Smaller screens / phones used just to preview the board */
  @media (max-width:640px){
    .board-title h1{ font-size:17px; letter-spacing:.1em; }
    .clock{ font-size:13px; }
    .column-labels, .order-row{ padding-left:16px; padding-right:16px; }
    .col-row{ width:40px; }
    .row-number{ width:40px; font-size:13px; }
    .flap{ width:34px; height:48px; font-size:24px; }
    .status-pill{ width:auto; }
    .status-pill span{ padding:4px 7px; font-size:9px; }
  }
</style>
</head>
<body>

<div class="board">
  <div class="conn-banner" id="connBanner"></div>
  <div class="board-header">
    <div class="board-title">
      <span class="live-dot"></span>
      <h1>ORDER STATUS BOARD</h1>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="column-labels">
    <div class="col-row">ROW</div>
    <div class="col-id">ORDER ID</div>
    <div class="col-status">STATUS</div>
  </div>

  <div class="rows" id="rows">
    <div class="empty-state">Waiting for orders…</div>
  </div>
</div>

<!-- Full-width orange marker for the most recently received order -->
<div class="latest-line" id="latestLine"></div>

<script type="module">
  // ============================================================
  // FIREBASE CONFIG — replace with your own project settings
  // Must match the config used in sender.html. databaseURL is
  // required for Realtime Database — find it in the Firebase
  // console under Realtime Database, shown above your data tree,
  // e.g. "https://nawroz-display-default-rtdb.firebaseio.com"
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCS-E1TSJXOGYEwkp3oOVMZXKiQq9h5Gyk",
    authDomain: "nawroz-display.firebaseapp.com",
    databaseURL: "https://nawroz-display-default-rtdb.firebaseio.com",
    projectId: "nawroz-display",
    storageBucket: "nawroz-display.firebasestorage.app",
    messagingSenderId: "26683759715",
    appId: "1:26683759715:web:738e6209f5ca3e3bd62c56",
    measurementId: "G-QQNWF76TF2"
  };

  // Must be the same path used in sender.html
  const DB_PATH = "board_orders";
  // ============================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getDatabase, ref, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, DB_PATH);

  const rowsEl = document.getElementById('rows');
  const connBanner = document.getElementById('connBanner');
  const clockEl = document.getElementById('clock');
  const latestLine = document.getElementById('latestLine');

  // Live clock — purely cosmetic, not user-entered
  function tickClock(){
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], { hour12:false });
  }
  tickClock();
  setInterval(tickClock, 1000);

  let knownIds = new Set();

  function buildFlaps(text, isNew){
    const frag = document.createDocumentFragment();
    const chars = (text || '').toUpperCase().split('');
    chars.forEach((ch, i) => {
      const flap = document.createElement('div');
      flap.className = 'flap' + (ch === ' ' ? ' space' : '') + (isNew ? ' animate' : '');
      if (isNew) flap.style.animationDelay = (i * 0.03) + 's';
      flap.textContent = ch === ' ' ? '' : ch;
      frag.appendChild(flap);
    });
    return frag;
  }

  // Positions the full-width orange line under whichever row was
  // most recently added, and keeps it there as the board scrolls/resizes.
  function positionLatestLine(rowEl){
    if (!rowEl){
      latestLine.classList.remove('visible');
      return;
    }
    const rect = rowEl.getBoundingClientRect();
    latestLine.style.top = (rect.bottom - 1) + 'px';
    latestLine.classList.add('visible');
  }

  // Scrolls the rows panel so the newest order is fully in view —
  // this is what keeps new numbers from landing below the fold.
  function scrollToRow(rowEl){
    if (!rowEl) return;
    rowEl.scrollIntoView({ behavior:'smooth', block:'end' });
  }

  let latestRowEl = null;
  let latestOrderId = null;
  window.addEventListener('resize', () => positionLatestLine(latestRowEl));
  document.getElementById('rows').addEventListener('scroll', () => positionLatestLine(latestRowEl));

  onValue(ordersRef,
    (snapshot) => {
      connBanner.style.display = 'none';

      const data = snapshot.val();
      const entries = data
        ? Object.entries(data).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0))
        : [];

      if (entries.length === 0) {
        rowsEl.innerHTML = '<div class="empty-state">Waiting for orders…</div>';
        knownIds = new Set();
        latestRowEl = null;
        positionLatestLine(null);
        return;
      }

      const currentIds = new Set();
      rowsEl.innerHTML = '';

      let rowNum = 1;
      let newestRowEl = null;
      let newestCreatedAt = -Infinity;
      let newestId = null;

      entries.forEach(([id, val]) => {
        currentIds.add(id);
        const isNew = !knownIds.has(id);

        const row = document.createElement('div');
        row.className = 'order-row';

        const numEl = document.createElement('div');
        numEl.className = 'row-number';
        numEl.textContent = String(rowNum).padStart(2, '0');

        const flapWrap = document.createElement('div');
        flapWrap.className = 'flap-id';
        flapWrap.appendChild(buildFlaps(val.orderId || '', isNew));

        const statusEl = document.createElement('div');
        statusEl.className = 'status-pill';
        statusEl.innerHTML = '<span>READY</span>';

        row.appendChild(numEl);
        row.appendChild(flapWrap);
        row.appendChild(statusEl);
        rowsEl.appendChild(row);

        // Track whichever row has the latest createdAt timestamp —
        // that's the one the orange line should mark.
        const createdAt = val.createdAt || 0;
        if (createdAt >= newestCreatedAt){
          newestCreatedAt = createdAt;
          newestRowEl = row;
          newestId = id;
        }

        rowNum++;
      });

      const arrivedNewOrder = newestId !== null && newestId !== latestOrderId;

      knownIds = currentIds;
      latestRowEl = newestRowEl;
      latestOrderId = newestId;

      // Wait a tick so layout has settled before measuring/scrolling
      requestAnimationFrame(() => {
        if (arrivedNewOrder) scrollToRow(latestRowEl);
        positionLatestLine(latestRowEl);
      });
    },
    (err) => {
      connBanner.style.display = 'block';
      connBanner.textContent = 'Connection error: ' + err.message;
    }
  );
</script>
</body>
</html>
